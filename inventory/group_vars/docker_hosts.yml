# inventory/group_vars/docker_hosts.yml
---
# Docker host configuration
docker_base_path: "/docker"
docker_compose_version: "2.20.0"

# Standard docker directory structure
docker_services:
  - sonarr
  - radarr
  - nginx-proxy-manager

# DDNS-Updater configuration
ddns_configs:
  - provider: "cloudflare"
    zone_identifier_secret: "DDNS_CLOUDFLARE_ZONE_ID"
    domain_secret: "DDNS_CLOUDFLARE_DOMAIN" 
    token_secret: "DDNS_CLOUDFLARE_TOKEN"
    ttl: 600
    ip_version: "ipv4"
    ipv6_suffix: ""
  # Add more configs if you have multiple domains/providers
  # - provider: "cloudflare"
  #   zone_identifier_secret: "DDNS_CLOUDFLARE_ZONE_ID_2"
  #   domain_secret: "DDNS_CLOUDFLARE_DOMAIN_2"
  #   token_secret: "DDNS_CLOUDFLARE_TOKEN_2"
  #   ttl: 300
  #   ip_version: "ipv4"