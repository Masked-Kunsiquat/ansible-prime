# roles/services/ddns-updater/defaults/main.yml
---
# DDNS-Updater default configuration
ddns_port: 8026
ddns_period: "5m"
ddns_cooldown_period: "5m"
ddns_publicip_fetchers: "all"
ddns_publicip_http_providers: "all"
ddns_publicipv4_http_providers: "all"
ddns_publicipv6_http_providers: "all"
ddns_publicip_dns_providers: "all"
ddns_dns_timeout: "3s"
ddns_http_timeout: "10s"
ddns_root_url: "/"
ddns_backup_period: "0"
ddns_log_level: "info"
ddns_log_caller: "hidden"
ddns_shoutrrr_addresses: ""

# DDNS configurations - override in group_vars or host_vars
ddns_configs:
  - provider: "cloudflare"
    zone_identifier_secret: "DDNS_CLOUDFLARE_ZONE_ID"
    domain_secret: "DDNS_CLOUDFLARE_DOMAIN"
    token_secret: "DDNS_CLOUDFLARE_TOKEN"
    ttl: 600
    ip_version: "ipv4"
    ipv6_suffix: ""