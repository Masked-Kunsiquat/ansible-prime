# roles/services/ddns-updater/tasks/main.yml
---
- name: Create ddns-updater directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ service_path }}"
    - "{{ service_path }}/data"
  vars:
    service_path: "{{ docker_base_path | default('/docker') }}/ddns-updater"

- name: Generate docker-compose.yml
  template:
    src: compose.yaml.j2
    dest: "{{ service_path }}/compose.yaml"
    mode: '0644'
  vars:
    service_path: "{{ docker_base_path | default('/docker') }}/ddns-updater"
  notify: restart ddns-updater

- name: Generate config.json
  template:
    src: config.json.j2
    dest: "{{ service_path }}/data/config.json"
    mode: '0600'
  vars:
    service_path: "{{ docker_base_path | default('/docker') }}/ddns-updater"
  notify: restart ddns-updater

- name: Start ddns-updater service
  docker_compose:
    project_src: "{{ service_path }}"
    state: present
  vars:
    service_path: "{{ docker_base_path | default('/docker') }}/ddns-updater"
